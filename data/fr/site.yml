  - company: "Concept Factory"
    role: "Développeur Web Front-End"
    start: "2018-12-01"
    end: null
    location: "Luxembourg"
    description:
      - "Co-conception d'IAWP, le thème WordPress interne de l'agence, avec deux collègues. Lead technique de la version 3.x (2026), menée en grande partie seul : mélange de blocs ACF, de blocs Gutenberg sur mesure et d'options ajoutées aux blocs natifs."
      - "Développement du plugin « IAWP Plugins », installé sur les projets récents : transformation visuelle des blocs natifs (ex. core/columns en carrousel SwiperJS)."
      - "Normalisation du workflow Git et déploiement continu via GitLab CI, co-écrit avec l'administrateur système et co-présenté à l'équipe lors d'un workshop. Utilisé depuis mars 2026 sur 5 à 6 projets clients : mise en production passée de 15–20 min (FTP manuel) à 2 min (build et rsync compris), et moins de conflits de merge."
      - "Migration en cours (depuis octobre 2026) vers une architecture de fichiers type Roots Bedrock, pour automatiser les mises à jour du cœur WordPress et des plugins."
      - "Consultant détaché chez Foyer Group (2 missions) : mise en production du site Foyer Assurances Belgique (oct.–déc. 2024), puis maintenance du site institutionnel et refonte des sites satellites au sein du pôle MarkComWeb (mars–déc. 2025)."
      - "Newsletters et bannières animées en JavaScript pour Luxair, Voyages Emile Weber et Tango."
