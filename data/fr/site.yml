identity:
  name: "Ange Chierchia"
  title: "Développeur WordPress senior · Gutenberg & front-end"
  summary: "Plus de 15 ans de développement web au Luxembourg, dont 8 ans sur WordPress en agence. Je conçois des thèmes et des blocs Gutenberg sur mesure pour des clients institutionnels et grands comptes, et je fais évoluer l'outillage de l'équipe : architecture type Bedrock, déploiement continu via GitLab CI, qui a ramené les mises en production de 15–20 min à 2 min. Auteur du plugin open source Blockshifter."
  location: "Metz, France"
  email: "ange.chierchia+job@gmail.com"
